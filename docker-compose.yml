version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: icebreaker
      POSTGRES_PASSWORD: icebreaker
      POSTGRES_DB: icebreaker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
